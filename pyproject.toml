[project]
name = "supply-chain-risk-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6", "pandas==2.2.3", "scipy==1.15.3", "duckdb==1.3.2",
  "scikit-learn==1.6.1", "lightgbm==4.6.0", "joblib==1.5.1",
  "matplotlib==3.10.3", "seaborn==0.13.2", "plotly==6.2.0",
  "streamlit==1.47.1", "nbformat==5.10.4", "nbclient==0.10.2", "ipykernel==6.29.5"
]
[project.optional-dependencies]
dev = ["pytest==8.4.1", "jupyterlab==4.4.5"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
